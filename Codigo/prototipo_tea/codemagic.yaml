workflows:
  android-apk-workflow:
    name: Compilar APK Android
    instance_type: mac_mini_m1
    max_build_duration: 60
    working_directory: Prototipo_tea
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Obtener dependencias de Flutter
        script: |
          flutter pub get
      - name: Compilar APK en release
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk